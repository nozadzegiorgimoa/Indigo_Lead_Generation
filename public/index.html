<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indigo Cars Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#16162B; --muted:#8B8BA3; --muted2:#7A7A93; --body-text:#4A4A63;
    --bg:#F6F6FA; --card:#fff; --line:#EAEAF2; --line-soft:#F1F1F7; --input-line:#E2E2EC;
    --accent:#5B4BE0; --accent-dark:#4A3BD0; --sidebar:#1E1B4B;
    --sidebar-muted:#9C97D8; --sidebar-link:#B4AFE8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Manrope','Noto Sans Georgian',system-ui,sans-serif; color:var(--ink); background:var(--bg); min-height:100vh; }
  button,input,select,textarea { font-family:inherit; }

  /* ── Login ── */
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:radial-gradient(1200px 600px at 20% -10%, #2A2668 0%, #1E1B4B 45%, #16143A 100%); }
  .login-card { width:100%; max-width:400px; background:var(--card); border-radius:20px; padding:36px 32px;
    box-shadow:0 24px 60px rgba(20,18,45,.35); }
  .login-brand { display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .login-brand .brand-mark { width:44px; height:44px; border-radius:13px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px; }
  .login-brand b { display:block; font-weight:800; font-size:16px; letter-spacing:.14em; }
  .login-brand span { display:block; font-weight:500; font-size:11px; letter-spacing:.22em; color:var(--muted); }
  .login-title { font-size:20px; font-weight:800; letter-spacing:-.02em; margin-bottom:4px; }
  .login-sub { font-size:13px; color:var(--muted); margin-bottom:24px; }
  .login-card label { display:block; margin-bottom:16px; }
  .login-error { background:#FDECEC; border:1px solid #F3C9C9; color:#A83A3A; padding:11px 14px;
    border-radius:10px; font-size:13px; font-weight:600; margin-bottom:16px; display:none; }
  .login-error.show { display:block; }

  .field-label { display:block; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted2); margin-bottom:8px; }
  .field-input { width:100%; padding:13px 14px; border:1px solid var(--input-line); border-radius:11px; font-size:15px; color:var(--ink); background:#fff; outline:none; }
  .field-input:focus { border-color:var(--accent); }
  textarea.field-input { resize:vertical; }
  .btn-full { width:100%; background:var(--accent); color:#fff; border:none; border-radius:11px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; margin-top:4px; }
  .btn-full:hover { background:var(--accent-dark); }
  .btn-full:disabled { opacity:.6; cursor:default; }

  /* ── App shell ── */
  .app { display:flex; min-height:100vh; }
  .sidebar { width:252px; flex:0 0 252px; background:var(--sidebar); color:#fff; padding:28px 20px; display:flex; flex-direction:column; gap:32px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark { width:38px; height:38px; border-radius:11px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; letter-spacing:.02em; }
  .brand-name { line-height:1.15; }
  .brand-name b { display:block; font-weight:800; font-size:15px; letter-spacing:.14em; }
  .brand-name span { display:block; font-weight:500; font-size:12px; letter-spacing:.22em; color:var(--sidebar-muted); }
  .nav { display:flex; flex-direction:column; gap:4px; }
  .nav button { text-align:left; background:transparent; color:var(--sidebar-link); border:none; border-radius:10px; padding:12px 14px; font-size:14px; font-weight:500; cursor:pointer; }
  .nav button:hover { background:rgba(255,255,255,.07); color:#fff; }
  .nav button.active { background:rgba(255,255,255,.12); color:#fff; font-weight:700; }
  .sidebar-foot { margin-top:auto; display:flex; flex-direction:column; gap:20px; }
  .lang-switch { display:flex; gap:6px; padding:4px; background:rgba(255,255,255,.07); border-radius:10px; }
  .lang-switch button { flex:1; background:transparent; color:var(--sidebar-link); border:none; border-radius:8px; padding:8px 0; font-size:12px; font-weight:700; cursor:pointer; }
  .lang-switch button.active { background:var(--accent); color:#fff; }
  .user { border-top:1px solid rgba(255,255,255,.12); padding-top:18px; display:flex; align-items:center; gap:11px; }
  .user-avatar { width:34px; height:34px; border-radius:50%; background:#3C3684; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#CFCBF5; }
  .user-info { line-height:1.3; min-width:0; }
  .user-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-role { font-size:11px; color:var(--sidebar-muted); }
  .logout-btn { background:none; border:none; color:var(--sidebar-link); font-size:12px; font-weight:600; cursor:pointer; padding:0; text-align:left; }
  .logout-btn:hover { color:#fff; }

  .main { flex:1; min-width:0; padding:34px 40px 56px; display:flex; flex-direction:column; gap:26px; max-width:1240px; }
  .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; }
  .kicker { font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  h1 { font-size:30px; font-weight:800; letter-spacing:-.02em; }
  .btn-primary { background:var(--accent); color:#fff; border:none; border-radius:11px; padding:14px 22px; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(91,75,224,.28); white-space:nowrap; }
  .btn-primary:hover { background:var(--accent-dark); }
  .toast { background:#E9F7F0; border:1px solid #BFE6D4; color:#146A48; padding:14px 18px; border-radius:12px; font-size:14px; font-weight:600; }
  .banner-error { background:#FDECEC; border:1px solid #F3C9C9; color:#A83A3A; padding:14px 18px; border-radius:12px; font-size:14px; font-weight:600; }
  .muted-note { color:var(--muted); font-size:14px; padding:20px 2px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; }
  .card h2 { font-size:16px; font-weight:700; margin-bottom:18px; }
  .stack { display:flex; flex-direction:column; gap:26px; }

  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; }
  .stat-label { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .stat-value { font-size:34px; font-weight:800; letter-spacing:-.03em; margin-top:10px; font-variant-numeric:tabular-nums; }
  .stat-hint { font-size:12px; color:var(--muted); margin-top:4px; }

  .dash-grid { display:grid; grid-template-columns:1.5fr 1fr; gap:20px; align-items:start; }
  .pipe-rows { display:flex; flex-direction:column; gap:14px; }
  .pipe-row { display:flex; align-items:center; gap:14px; }
  .pipe-label { width:120px; flex:0 0 120px; font-size:13px; font-weight:600; }
  .pipe-track { flex:1; height:10px; background:var(--line-soft); border-radius:99px; overflow:hidden; }
  .pipe-bar { height:100%; border-radius:99px; }
  .pipe-count { width:34px; text-align:right; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }
  .op-rows { display:flex; flex-direction:column; gap:13px; }
  .op-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .op-name { font-size:13px; font-weight:600; line-height:1.3; }
  .op-branch { font-size:11px; color:var(--muted); }
  .op-open { font-size:13px; font-weight:700; color:var(--accent); white-space:nowrap; }

  .section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .section-head h2 { margin:0; }
  .link-btn { background:none; border:none; color:var(--accent); font-size:13px; font-weight:700; cursor:pointer; }
  .recent-row { display:grid; grid-template-columns:1.4fr 1fr 1.2fr auto; gap:16px; align-items:center; text-align:left; width:100%; background:none; border:none; border-bottom:1px solid var(--line-soft); padding:15px 2px; cursor:pointer; }
  .recent-row:hover { background:#FAFAFD; }
  .cell-name { font-size:14px; font-weight:700; }
  .cell-phone { font-size:12px; color:var(--muted); white-space:nowrap; }
  .cell-dim { font-size:13px; color:var(--body-text); }
  .badge { display:inline-block; padding:6px 12px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap; justify-self:start; }

  .lead-form { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:32px; display:flex; flex-direction:column; gap:26px; max-width:900px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:#fff; color:var(--body-text); border:1px solid var(--input-line); border-radius:99px; padding:10px 16px; font-size:13px; font-weight:600; cursor:pointer; }
  .chip.active { background:var(--sidebar); color:#fff; border-color:var(--sidebar); }
  .form-foot { display:flex; align-items:center; justify-content:space-between; gap:20px; border-top:1px solid var(--line-soft); padding-top:22px; flex-wrap:wrap; }
  .assign-preview { display:flex; align-items:center; gap:12px; }
  .assign-avatar { width:34px; height:34px; border-radius:50%; background:#EDEBFB; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--accent); }
  .assign-label { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted2); }
  .assign-name { font-size:14px; font-weight:600; }
  .btn-secondary { background:#fff; color:var(--body-text); border:1px solid var(--input-line); border-radius:11px; padding:13px 20px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn-save { background:var(--accent); color:#fff; border:none; border-radius:11px; padding:13px 26px; font-size:14px; font-weight:700; cursor:pointer; }
  .btn-save:hover { background:var(--accent-dark); }
  .btn-save:disabled { opacity:.6; cursor:default; }

  .list-tools { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .search-input { flex:1; min-width:240px; padding:13px 16px; border:1px solid var(--input-line); border-radius:11px; font-size:14px; background:#fff; outline:none; }
  .search-input:focus { border-color:var(--accent); }
  .table-wrap { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow-x:auto; }
  .table-head { display:grid; grid-template-columns:1.3fr 1fr 1fr .9fr 1fr 110px; gap:16px; min-width:900px; padding:15px 24px; background:#FAFAFD; border-bottom:1px solid var(--line); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .table-row { display:grid; grid-template-columns:1.3fr 1fr 1fr .9fr 1fr 110px; gap:16px; min-width:900px; align-items:center; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid #F4F4F9; padding:17px 24px; cursor:pointer; }
  .table-row:hover { background:#FAFAFD; }
  .count-label { font-size:12px; color:var(--muted); }

  .detail-grid { display:grid; grid-template-columns:1.6fr 1fr; gap:20px; align-items:start; }
  .detail-card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:30px; display:flex; flex-direction:column; gap:26px; }
  .detail-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
  .back-btn { background:none; border:none; padding:0; color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; margin-bottom:10px; }
  .back-btn:hover { color:var(--accent); }
  .detail-name { font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .detail-meta { font-size:13px; color:var(--muted); margin-top:6px; }
  .fields-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px 28px; }
  .f-label { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .f-value { font-size:15px; font-weight:600; overflow-wrap:anywhere; }
  .notes-box { font-size:14px; line-height:1.6; color:#3A3A55; background:#FAFAFD; border:1px solid var(--line-soft); border-radius:12px; padding:16px; text-wrap:pretty; }
  .side-stack { display:flex; flex-direction:column; gap:20px; }
  .side-title { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
  .status-actions { display:flex; flex-direction:column; gap:8px; }
  .status-btn { text-align:left; background:#fff; color:var(--body-text); border:1px solid var(--input-line); border-radius:10px; padding:12px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  .assignee { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .assignee-avatar { width:38px; height:38px; border-radius:50%; background:#EDEBFB; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--accent); }
  .assignee-name { font-size:14px; font-weight:700; }
  .assignee-branch { font-size:12px; color:var(--muted); }
  .reassign-select { width:100%; padding:12px 14px; border:1px solid var(--input-line); border-radius:11px; font-size:14px; background:#fff; outline:none; }
  .history { display:flex; flex-direction:column; gap:14px; }
  .history-item { display:flex; gap:12px; }
  .history-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); margin-top:6px; flex:0 0 8px; }
  .history-text { font-size:13px; font-weight:600; line-height:1.4; }
  .history-at { font-size:11px; color:var(--muted); }

  .spinner { width:26px; height:26px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; margin:40px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration:2s; } }

  @media (max-width:1000px) { .stats { grid-template-columns:repeat(2,1fr); } .dash-grid,.detail-grid { grid-template-columns:1fr; } }
  @media (max-width:780px) {
    .app { flex-direction:column; }
    .sidebar { width:100%; flex:none; flex-direction:row; align-items:center; gap:16px; padding:14px 16px; flex-wrap:wrap; }
    .nav { flex-direction:row; flex:1; gap:2px; }
    .nav button { padding:10px 12px; font-size:13px; }
    .sidebar-foot { margin:0; flex-direction:row; align-items:center; gap:12px; }
    .user { border:none; padding:0; }
    .user-info { display:none; }
    .main { padding:22px 16px 48px; }
    .page-head { flex-wrap:wrap; align-items:center; }
    h1 { font-size:24px; }
    .form-grid,.fields-grid { grid-template-columns:1fr; }
    .lead-form { padding:22px; }
    .recent-row { grid-template-columns:1.4fr 1fr auto; }
    .recent-row .col-operator { display:none; }
  }
  @media (max-width:480px) { .stats { grid-template-columns:1fr; } }
</style>
</head>

function fmtDateTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso); if (isNaN(d)) return esc(iso);
  const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
  const p = n => String(n).padStart(2,"0");
  return d.getDate()+" "+mon+", "+p(d.getHours())+":"+p(d.getMinutes());
}
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso); if (isNaN(d)) return esc(iso);
  const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
  return d.getDate()+" "+mon+" "+d.getFullYear();
}

/* ── API ── */
async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ "Content-Type":"application/json" }, opts.headers || {});
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  let res;
  try {
    res = await fetch(path, { method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  } catch (e) {
    throw new Error("Network error — check your connection.");
  }
  let data = null;
  try { data = await res.json(); } catch (e) { /* non-JSON */ }
  // A 401 on a normal request means the session token is stale → sign out.
  // The login call is exempt: there a 401 is just wrong credentials.
  const isLogin = path.indexOf("/api/login") !== -1;
  if (res.status === 401 && !isLogin) {
    logout();
    throw new Error((data && data.error) || "Session expired. Please sign in again.");
  }
  if (!res.ok) throw new Error((data && data.error) || ("Request failed (" + res.status + ")"));
  return data;
}

function logout() {

async function route() {
  if (!state.token) return renderLogin();
  // Force a first-login password change before anything else.
  if (state.user && state.user.mustChange && state.view !== "password") state.view = "password";
  loading();
  try {
    if (state.view === "password") viewPassword();
    else if (state.view === "users") await viewUsers();
    else if (state.view === "dashboard") await viewDashboard();
    else if (state.view === "new") await viewNew();
    else if (state.view === "list") await viewList();
    else if (state.view === "detail") await viewDetail(state.selectedId);
    else await viewDashboard();
  } catch (err) {
    if (state.token) showError(err.message);
  }
}

  // Live check (phone validity + duplicate + parsed preview) on comment/phone blur.
  const runCheck = async () => {
    try {

      if (mode === "short") p.set("notes", state.form.notes || "");
      else p.set("phone", state.form.phone || "");

  };

  if (notesEl && mode === "short") notesEl.addEventListener("blur", runCheck);

  if (phoneEl && mode === "full") phoneEl.addEventListener("blur", runCheck);

  $("#lead-form").onsubmit = e => { e.preventDefault(); submitLead(false); };

function renderHints(r) {
  const box = el("lead-hints"); if (!box) return;
  const tr = t(); let html = "";
  if (r && r.duplicate) {
    const d = r.duplicate;
    html += '<div class="banner-error" style="display:block;text-align:left">' +
      '<strong>'+esc(tr.dupTitle)+'</strong><br>' +
      esc(d.name || "#"+d.id) + ' · ' + esc(tr.dupManager)+': '+esc(d.manager||"—") +
      ' · ' + esc(tr.dupSource)+': '+esc(d.source||"—") +
      ' · ' + esc(tr.dupRegistered)+': '+esc(fmtDate(d.createdAt)) +
      ' · ' + esc(tr.dupStatus)+': '+esc(stLabel(d.status)) +
      '<br><button type="button" class="btn-secondary" id="dup-open" style="margin-top:8px">'+esc(tr.dupOpen)+'</button></div>';
  } else if (r && r.phone && r.phone.found && !r.phone.valid) {
    html += '<div class="banner-error" style="display:block">'+esc(tr.phoneInvalidTitle)+'</div>';
  } else if (r && r.phone && r.phone.valid && r.phone.countryName) {
    html += '<div class="assign-label" style="margin-top:6px">'+esc(r.phone.e164)+' · '+esc(r.phone.countryName)+'</div>';
  }
  if (r && r.parsed) {
    const pz = r.parsed, bits = [];
    if (pz.name) bits.push(esc(tr.fullName)+": "+esc(pz.name));
    if (pz.source) bits.push(esc(tr.source)+": "+esc(pz.source));
    if (pz.customerType) bits.push(esc(tr.customerType)+": "+esc(pz.customerType));
    if (pz.country) bits.push(esc(tr.country)+": "+esc(pz.country));
    if (pz.city) bits.push(esc(tr.city)+": "+esc(pz.city));
    if (bits.length) html += '<div class="assign-label" style="margin-top:8px"><em>'+esc(tr.parsedPreview)+':</em> '+bits.join(" · ")+'</div>';
  }
  box.innerHTML = html;
  const dupBtn = el("dup-open");
  if (dupBtn && r.duplicate) dupBtn.onclick = () => { state.form = { ...EMPTY }; goto("detail", r.duplicate.id); };
}

async function submitLead(confirmInvalid) {
  const tr = t(), mode = state.formMode, f2 = state.form;
  if (mode === "short") { if (!(f2.notes || "").trim()) { alert(tr.notes + " —"); return; } }
  else if (!(f2.name || "").trim() && !(f2.phone || "").trim()) return;

  const btn = el("form-save"); if (btn) { btn.disabled = true; btn.textContent = tr.saving; }
  const resetBtn = () => { if (btn) { btn.disabled = false; btn.textContent = tr.save; } };

  const headers = { "Content-Type": "application/json" };
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const body = Object.assign({}, f2, { formMode: mode, confirmInvalidPhone: !!confirmInvalid });

  let res, data;
  try {
    res = await fetch("/api/leads", { method: "POST", headers, body: JSON.stringify(body) });
    data = await res.json().catch(() => null);
  } catch (e) { resetBtn(); alert("Network error — check your connection."); return; }

  if (res.status === 401) { logout(); return; }
  if (res.status === 422 && data && data.status === "invalid_phone") {
    resetBtn();
    if (confirm((data.message || tr.phoneInvalidTitle) + "\n\n" + tr.phoneConfirm)) submitLead(true);
    return;
  }
  if (res.status === 409 && data && data.status === "duplicate") {
    resetBtn(); renderHints({ duplicate: data.existing }); window.scrollTo({ top: 0 }); return;
  }
  if (!res.ok) { resetBtn(); alert((data && data.error) || ("Request failed (" + res.status + ")")); return; }

  // Success.
  state.form = { ...EMPTY };
  state.view = "detail"; state.selectedId = data.id;
  const who = data.saleOperator ? data.saleOperator.name : (data.operatorName || "");
  state.toast = tr.saved + who;
  window.scrollTo({ top: 0 });
  route();
}

    catch (err) { alert(err.message); }
  });
  $("#view").querySelectorAll("[data-reset]").forEach(b => b.onclick = async () => {
    if (!confirm(t().confirmReset)) return;
    try {
      const r = await api("/api/users/"+b.dataset.reset, { method:"PATCH", body:{ resetPassword:true } });
      const u = d.users.find(x => String(x.id) === b.dataset.reset);
      state.lastCredential = { heading:t().tempPasswordReset, email:u?u.email:"", tempPassword:r.tempPassword };
      route();
    } catch (err) { alert(err.message); }
  });
}

/* ══════════════ BOOT ══════════════ */
async function boot() {
  document.documentElement.lang = state.lang;
  if (!state.token) return renderLogin();
  loading();
  try {
    const me = await api("/api/me");
    state.user = { id:me.id, name:me.name, role:me.role, branch:me.branch, mustChange:!!me.mustChange };
    if (state.user.mustChange) state.view = "password";
    await route();
  } catch (err) {
    // Token invalid/expired or backend unreachable → back to login.
    logout();
    if (!/sign in/i.test(err.message)) renderLogin(err.message);
  }
}

boot();
</script>
</body>
</html>
